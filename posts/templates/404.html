{% extends "posts/base.html" %}

{% block title %}Page Not Found — TenantBlog{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 text-center space-y-6">

    <div class="flex justify-center">
        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
    </div>

    <div>
        <p class="text-5xl font-extrabold text-gray-200">404</p>
        <h1 class="mt-2 text-2xl font-bold text-gray-900">Page Not Found</h1>
        <p class="mt-2 text-sm text-gray-500">
            The page you're looking for doesn't exist or has been removed.
        </p>
    </div>

    <a href="{% url 'home' %}"
       class="inline-flex items-center gap-1.5 text-sm font-medium text-brand-600 hover:text-brand-800 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Go to Dashboard
    </a>

</div>
{% endblock %}
