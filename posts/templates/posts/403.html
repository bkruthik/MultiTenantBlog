{% extends "posts/base.html" %}

{% block title %}Permission Denied — TenantBlog{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 text-center space-y-6">

    <div class="flex justify-center">
        <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0-10.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286zm0 13.036h.008v.008H12v-.008z"/>
            </svg>
        </div>
    </div>

    <div>
        <h1 class="text-2xl font-bold text-gray-900">Permission Denied</h1>
        <p class="mt-2 text-sm text-gray-500">
            {{ message|default:"You don't have permission to perform this action." }}
        </p>
    </div>

    <div class="flex items-center justify-center gap-3">
        <a href="{% url 'home' %}"
           class="inline-flex items-center gap-1.5 text-sm font-medium text-brand-600 hover:text-brand-800 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Go to Dashboard
        </a>
    </div>

</div>
{% endblock %}
